<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Joker Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgba(0, 0, 0, 0);
            font-family: 'Inter', 'Cairo', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ===== MAIN WRAPPER ===== */
        #menu {
            position: absolute;
            top: 15%;
            left: 50px;
            /* Shifted right slightly to make room for scrollbar */
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Gap between separate blocks */
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #menu.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Shared block styles */
        .block {
            background: rgba(12, 4, 4, 0.98);
            border-radius: 6px;
            border: 1px solid rgba(255, 20, 20, 0.3);
            box-shadow: 0 0 15px rgba(100, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
        }

        /* ===== TOP BLOCK (Header + Tabs) ===== */
        .menu-top {
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            height: 110px;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #8b0000;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(200, 0, 0, 0.1), rgba(0, 0, 0, 0.8));
            pointer-events: none;
        }

        .header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Make it fill like a banner */
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        /* Tabs inside Top Block */
        .tabs {
            display: flex;
            width: 100%;
            background: rgba(15, 2, 2, 0.95);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 1 0 auto;
            text-align: center;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            cursor: default;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #fff;
            background: linear-gradient(to top, rgba(255, 20, 20, 0.2), transparent);
            border-bottom: 3px solid #ff3333;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        /* ===== BODY BLOCK (Items) ===== */
        .menu-body {
            height: 480px;
            position: relative;
        }

        .items-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 5px 0;
        }

        .items-container::-webkit-scrollbar {
            display: none;
        }

        /* External Scrollbar */
        .scroll-indicator {
            position: absolute;
            top: 0;
            left: -15px;
            /* Detached to the left */
            width: 6px;
            height: 100%;
            background: rgba(10, 2, 2, 0.8);
            border-radius: 3px;
            border: 1px solid rgba(255, 20, 20, 0.2);
            overflow: hidden;
        }

        .scroll-thumb {
            width: 100%;
            background: #ff3333;
            border-radius: 3px;
            position: absolute;
            top: 0;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
            transition: top 0.1s ease, height 0.1s ease;
        }

        /* ===== FOOTER BLOCK ===== */
        .menu-footer {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .footer-counter {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== ITEM STYLES ===== */
        .item {
            width: 100%;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border-left: 3px solid transparent;
            transition: all 0.1s ease;
        }

        .item.selected {
            background: linear-gradient(90deg, rgba(220, 20, 20, 0.35) 0%, rgba(40, 5, 5, 0.15) 100%);
            border: 1px solid rgba(255, 50, 50, 0.6);
            border-left: 4px solid #ff3333;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(255, 30, 30, 0.25);
            transform: translateX(4px);
        }

        .item-label {
            font-size: 14px;
            font-weight: 500;
            color: #dcdcdc;
            transition: color 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .item.selected .item-label {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.4);
        }

        /* Submenu arrow */
        .item-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
        }

        .item.selected .item-arrow {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.6);
        }

        /* Controls */
        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .slider-track {
            width: 90px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: visible;
        }

        .slider-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s ease;
        }

        .slider-knob {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.1s ease;
        }

        .item.selected .slider-fill {
            background: #ff3333;
        }

        .item.selected .slider-knob {
            background: #ff3333;
            box-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        /* Toggle */
        .toggle {
            width: 28px;
            height: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.2s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #aaa;
            transition: all 0.2s;
        }

        .toggle.on {
            background: rgba(255, 50, 50, 0.3);
            border: 1px solid #ff3333;
        }

        .toggle.on::after {
            left: 14px;
            background: #ff3333;
            box-shadow: 0 0 5px #ff3333;
        }

        .item-value {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            min-width: 35px;
            text-align: right;
        }

        .item.selected .item-value {
            color: #ffcccc;
        }

        /* ===== STARTUP NOTIFICATION ===== */
        #startup-notification {
            position: absolute;
            top: 30px;
            right: -400px;
            width: 320px;
            background: rgba(12, 4, 4, 0.98);
            /* Solid color matching menu */
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            /* Centered layout */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.3);
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
            opacity: 0;
            z-index: 1000;
        }

        #startup-notification.show {
            right: 30px;
            opacity: 1;
        }

        #startup-notification img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
            margin-bottom: 10px;
            transform: scale(2.0);
            /* Drastically increase visual size */
        }

        .startup-content {
            text-align: center;
        }

        .startup-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.8);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .startup-message {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }

        /* ===== SIDE NOTIFICATIONS ===== */
        .notif-container {
            position: absolute;
            bottom: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 999;
        }

        .notif {
            background: rgba(12, 4, 4, 0.98);
            /* Solid matching color */
            border: 1px solid rgba(255, 20, 20, 0.3);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            width: 280px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            /* Center horizontally */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            color: #fff;
            font-family: 'Inter', 'Cairo', sans-serif;
        }

        .notif img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.5));
            transform: scale(2.5);
            /* Make logo appear MUCH larger inside the box */
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .notif-label {
            font-size: 13px;
            font-weight: 600;
            color: #eee;
        }

        .notif-status {
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
        }

        .notif.state-on .notif-status {
            color: #4CAF50;
        }

        .notif.state-off .notif-status {
            color: #F44336;
        }

        .notif.fade-out {
            animation: slideOut 0.4s ease forwards;
        }

        /* ===== LANGUAGE SELECTOR ===== */
        #lang-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 320px;
            background: rgba(12, 4, 4, 0.98);
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-top: 4px solid #ff3333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        #lang-selector.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .lang-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        .lang-option {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            transition: all 0.2s ease;
        }

        .lang-option.selected {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.4);
        }

        .lang-hint {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }

        /* ===== JK ARMORY PANEL (RIGHT SIDE - LARGE & TALL CARDS GRID) ===== */
        #jk-armory {
            position: absolute;
            top: 15px;
            right: 15px;
            bottom: 15px;
            width: 780px;
            height: calc(100vh - 30px);
            background: linear-gradient(180deg, rgba(10, 8, 14, 0.98) 0%, rgba(16, 11, 22, 0.98) 100%);
            border: 1px solid rgba(229, 9, 20, 0.35);
            border-radius: 16px;
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(229, 9, 20, 0.2);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(40px);
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #jk-armory.visible {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .armory-header {
            padding: 18px 24px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.015);
        }

        .armory-stats {
            display: flex;
            gap: 12px;
        }

        .armory-stat-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .armory-stat-label {
            font-size: 10px;
            color: #888;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .armory-stat-val {
            font-size: 14px;
            color: #ff3333;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .armory-logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .armory-badge {
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 10px;
            color: #ff5555;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .armory-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .armory-logo-text {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        .armory-logo-text span {
            color: #e50914;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .armory-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ff2222 0%, #cc0000 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            color: #fff;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .armory-keys-bar {
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .armory-keys-bar::-webkit-scrollbar {
            display: none;
        }

        .armory-key-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 10px;
            color: #ccc;
            font-weight: 600;
            white-space: nowrap;
        }

        .armory-key-pill b {
            color: #ff4444;
            font-weight: 700;
        }

        .armory-cats {
            display: flex;
            gap: 8px;
            padding: 14px 24px 12px;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .armory-cats::-webkit-scrollbar {
            display: none;
        }

        .armory-cat {
            padding: 8px 18px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #999;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
        }

        .armory-cat:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .armory-cat.active {
            background: #e50914;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.45);
        }

        .armory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding: 18px 24px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .armory-grid::-webkit-scrollbar {
            width: 5px;
        }

        .armory-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .armory-grid::-webkit-scrollbar-thumb {
            background: rgba(229, 9, 20, 0.4);
            border-radius: 4px;
        }

        .armory-card {
            background: rgba(20, 16, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 155px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .armory-card:hover {
            border-color: rgba(229, 9, 20, 0.4);
            background: rgba(28, 22, 36, 0.95);
        }

        .armory-card.selected {
            border: 2px solid #ff1e27 !important;
            background: linear-gradient(180deg, rgba(229, 9, 20, 0.22) 0%, rgba(22, 16, 28, 0.95) 100%);
            box-shadow: 0 0 25px rgba(255, 30, 39, 0.55);
            transform: translateY(-3px) scale(1.02);
        }

        .armory-card-badge {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .armory-card.selected .armory-card-badge {
            color: #fff;
            background: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        .armory-card-img {
            width: 110px;
            height: 65px;
            object-fit: contain;
            margin-top: 10px;
            margin-bottom: 4px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s;
        }

        .armory-card.selected .armory-card-img {
            transform: scale(1.08);
        }

        .armory-card-watermark {
            font-size: 8px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.22);
            letter-spacing: 1.5px;
            margin: 4px 0;
            text-transform: uppercase;
        }

        .armory-card-name {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .armory-card.selected .armory-card-name {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        .armory-card-hash {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 60, 60, 0.75);
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Professional Premium Custom Input Field - Smooth Rounded Edges & Glassmorphism */
        .item-input-field {
            width: 200px;
            padding: 7px 14px;
            background: rgba(16, 18, 28, 0.92);
            border: 1px solid rgba(0, 210, 255, 0.45);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .item-input-field:focus {
            border-color: rgba(0, 210, 255, 0.95);
            box-shadow: 0 0 14px rgba(0, 210, 255, 0.4), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            background: rgba(22, 26, 40, 0.98);
        }

        .item-input-field::placeholder {
            color: rgba(255, 255, 255, 0.38);
            font-style: italic;
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }
    </style>
</head>

<body>
    <!-- STARTUP NOTIFICATION -->
    <div id="startup-notification">
        <img src="https://j.top4top.io/p_3857fwuju1.png" alt="JK">
        <div class="startup-content">
            <div class="startup-title">JK MENU</div>
            <div class="startup-message">مرحباً بك في المنيو</div>
        </div>
    </div>

    <!-- MAIN MENU WRAPPER -->
    <div id="menu">

        <!-- TOP BLOCK: Header + Tabs -->
        <div class="block menu-top">
            <div class="header">
                <!-- Using the header eagle with full width banner style -->
                <img src="https://l.top4top.io/p_38575ot9i1.png" alt="Banner">
            </div>
            <div class="tabs" id="tabsContainer"></div>
        </div>

        <!-- BODY BLOCK: Items -->
        <div class="block menu-body">
            <div class="scroll-indicator">
                <div class="scroll-thumb" id="scrollThumb"></div>
            </div>
            <div class="items-container" id="itemsContainer"></div>
        </div>

        <!-- FOOTER BLOCK: Info -->
        <div class="block menu-footer">
            <span class="footer-text">Joker Menu V2</span>
            <span class="footer-counter" id="footerCounter">(0/0)</span>
        </div>

    </div>

    <div class="notif-container" id="notifContainer"></div>

    <!-- LANGUAGE SELECTOR -->
    <div id="lang-selector">
        <div class="lang-title" id="langTitle">Choose your language<br>اختر لغتك</div>
        <div class="lang-option" id="lang-en">English</div>
        <div class="lang-option" id="lang-ar">العربية</div>
        <div class="lang-hint">Press ENTER to select / اضغط انتر للاختيار</div>
    </div>

    <!-- JK ARMORY PANEL -->
    <div id="jk-armory">
        <div class="armory-header">
            <div class="armory-stats">
                <div class="armory-stat-box">
                    <span class="armory-stat-label">السيرفر</span>
                    <span class="armory-stat-val">JK7</span>
                </div>
                <div class="armory-stat-box">
                    <span class="armory-stat-label">أقسام</span>
                    <span class="armory-stat-val" id="armoryCatCount">0</span>
                </div>
                <div class="armory-stat-box">
                    <span class="armory-stat-label">إجمالي الأسلحة</span>
                    <span class="armory-stat-val" id="armoryItemCount">0</span>
                </div>
            </div>
            <div class="armory-logo-wrap">
                <div class="armory-badge" id="armoryBadge">DISCORD.GG/JKMENU</div>
                <div class="armory-logo">
                    <div class="armory-logo-text">JK <span>ARMORY</span></div>
                    <div class="armory-logo-icon">JK</div>
                </div>
            </div>
        </div>

        <div class="armory-keys-bar">
            <div class="armory-key-pill">[الأسهم] <b>للتنقل</b></div>
            <div class="armory-key-pill">[Q / E] <b>لتبديل الأقسام</b></div>
            <div class="armory-key-pill">[ENTER] <b>للحصول على السلاح</b></div>
            <div class="armory-key-pill">[ESC / BACKSPACE] <b>للإغلاق</b></div>
        </div>

        <div class="armory-cats" id="armoryCats"></div>

        <div class="armory-grid" id="armoryList"></div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const tabsContainer = document.getElementById('tabsContainer');
        const itemsContainer = document.getElementById('itemsContainer');
        const footerCounter = document.getElementById('footerCounter');
        const scrollThumb = document.getElementById('scrollThumb');
        const notifContainer = document.getElementById('notifContainer');
        const langSelector = document.getElementById('lang-selector');
        const langEn = document.getElementById('lang-en');
        const langAr = document.getElementById('lang-ar');

        let currentData = null;

        // Listen for messages from Lua
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'menuUpdate':
                    handleMenuUpdate(data);
                    langSelector.classList.remove('show');
                    break;
                case 'notification':
                    showNotification(data.label, data.state);
                    break;
                case 'startup':
                    showStartupNotification(data.label);
                    break;
                case 'langSelect':
                    showLangSelect(data.selectedLang);
                    break;
                case 'spawnMenuUpdate':
                    handleSpawnMenuUpdate(data);
                    break;
            }
        });

        // ===== JK ARMORY (SPAWN MENU RIGHT PANEL - LARGE CARDS GRID) =====
        const jkArmory = document.getElementById('jk-armory');
        const armoryCats = document.getElementById('armoryCats');
        const armoryItemCount = document.getElementById('armoryItemCount');
        const armoryCatCount = document.getElementById('armoryCatCount');
        const armoryList = document.getElementById('armoryList');

        function handleSpawnMenuUpdate(data) {
            if (!data.open) {
                if (jkArmory) jkArmory.classList.remove('visible');
                return;
            }
            if (menu) menu.classList.remove('visible');
            if (jkArmory) jkArmory.classList.add('visible');

            // Update stats
            const cats = data.categories || [];
            if (armoryCatCount) armoryCatCount.textContent = cats.length;
            let totItems = 0;
            cats.forEach(c => totItems += (c.items ? c.items.length : 0));
            if (armoryItemCount) armoryItemCount.textContent = totItems;

            if (cats.length === 0) return;

            const safeCatIdx = Math.max(1, Math.min(cats.length, data.currentCat || 1));
            const currentCategory = cats[safeCatIdx - 1];
            const safeItemIdx = Math.max(1, data.currentIndex || 1);

            // Render Categories Tabs
            let tabsHtml = '';
            cats.forEach((cat, index) => {
                const isActive = (index + 1) === safeCatIdx ? 'active' : '';
                tabsHtml += `<div class="armory-cat ${isActive}">${cat.label || cat.name || ''}</div>`;
            });
            if (armoryCats) armoryCats.innerHTML = tabsHtml;

            // Render Cards Grid
            let listHtml = '';
            if (currentCategory && currentCategory.items) {
                currentCategory.items.forEach((item, index) => {
                    const isSelected = (index + 1) === safeItemIdx ? 'selected' : '';
                    const imgUrl = item.img || 'https://j.top4top.io/p_3857fwuju1.png';
                    const spawnCode = item.spawn || item.name || '';

                    listHtml += `
                        <div class="armory-card ${isSelected}" id="armory-card-${index + 1}">
                            <div class="armory-card-badge">#${index + 1}</div>
                            <img src="${imgUrl}" class="armory-card-img" onerror="this.src='https://j.top4top.io/p_3857fwuju1.png'">
                            <div class="armory-card-watermark">DISCORD.GG/JKMENU</div>
                            <div class="armory-card-name">${item.name || item.label || ''}</div>
                            <div class="armory-card-hash">${spawnCode}</div>
                        </div>
                    `;
                });
            }
            if (armoryList) armoryList.innerHTML = listHtml;

            // Scroll selected tab and card into view
            setTimeout(() => {
                if (armoryCats) {
                    const activeCat = armoryCats.querySelector('.armory-cat.active');
                    if (activeCat) activeCat.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                }
                if (armoryList) {
                    const activeItem = armoryList.querySelector('.armory-card.selected');
                    if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 30);
        }

        // ===== LANGUAGE SELECTOR =====
        function showLangSelect(selected) {
            langSelector.classList.add('show');
            if (selected === 'en') {
                langEn.classList.add('selected');
                langAr.classList.remove('selected');
            } else {
                langAr.classList.add('selected');
                langEn.classList.remove('selected');
            }
        }

        // ===== STARTUP NOTIFICATION =====
        function showStartupNotification(label) {
            const el = document.getElementById('startup-notification');
            el.classList.add('show');
            setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        // ===== MENU UPDATE =====
        function handleMenuUpdate(data) {
            currentData = data;

            if (!data.open) {
                menu.classList.remove('visible');
                return;
            }

            if (jkArmory) jkArmory.classList.remove('visible');
            menu.classList.add('visible');

            renderTabs(data.tabs);
            renderItems(data.items);
            updateScrollbar(data.currentIndex, data.totalItems);
            footerCounter.textContent = '(' + data.currentIndex + '/' + data.totalItems + ')';
        }

        // ===== RENDER TABS =====
        function renderTabs(tabs) {
            if (!tabs) return;

            const frag = document.createDocumentFragment();
            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.active ? ' active' : '');
                el.textContent = tab.name;
                frag.appendChild(el);
            });

            tabsContainer.innerHTML = '';
            tabsContainer.appendChild(frag);

            // Scroll the active tab into view so hidden tabs on the right are revealed
            setTimeout(() => {
                const activeTab = tabsContainer.querySelector('.tab.active');
                if (activeTab) {
                    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 50);
        }

        // ===== RENDER ITEMS =====
        function renderItems(items) {
            if (!items) return;

            const frag = document.createDocumentFragment();

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.15);font-size:14px;';
                empty.textContent = 'No items available';
                frag.appendChild(empty);
                itemsContainer.innerHTML = '';
                itemsContainer.appendChild(frag);
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                const isSection = item.label && item.label.startsWith('~y~');
                el.className = 'item' + (item.selected ? ' selected' : '') + (isSection ? ' item-section' : '');

                // Label
                const label = document.createElement('span');
                label.className = 'item-label';

                let labelText = (item.label || '').replace(/~[a-zA-Z]~/g, '');

                if (item.type === 'toggle_slider' && item.value !== undefined) {
                    labelText += ': ' + Number(item.value).toFixed(2);
                } else if (item.type === 'key_slider' && item.keyLabel) {
                    labelText += ': [' + item.keyLabel + ']';
                } else if (item.type === 'player_slider' && item.playerInfo) {
                    labelText += ': ' + item.playerInfo;
                } else if (item.type === 'slider' && item.value !== undefined) {
                    if (item.valueDisplay) {
                        labelText += ': [' + item.valueDisplay + ']';
                    } else {
                        labelText += ': ' + Math.floor(item.value);
                    }
                }

                label.textContent = labelText;
                el.appendChild(label);

                // Controls wrapper
                const controls = document.createElement('div');
                controls.className = 'item-controls';

                // Slider
                if (['slider', 'toggle_slider', 'key_slider', 'player_slider'].includes(item.type)) {
                    const range = (item.max || 1) - (item.min || 0);
                    const pct = range > 0 ? (((item.value || 0) - (item.min || 0)) / range) * 100 : 0;

                    const track = document.createElement('div');
                    track.className = 'slider-track';

                    const fill = document.createElement('div');
                    fill.className = 'slider-fill';
                    fill.style.width = Math.min(100, Math.max(0, pct)) + '%';

                    const knob = document.createElement('div');
                    knob.className = 'slider-knob';
                    knob.style.left = Math.min(100, Math.max(0, pct)) + '%';

                    track.appendChild(fill);
                    track.appendChild(knob);
                    controls.appendChild(track);
                }

                // Toggle
                if (item.type === 'toggle' || item.type === 'checkbox' || item.type === 'toggle_slider') {
                    const toggle = document.createElement('div');
                    toggle.className = 'toggle ' + (item.state ? 'on' : 'off');
                    controls.appendChild(toggle);
                }

                // Custom Professional Text Input with Enter Key Trigger (No separate button needed)
                if (item.type === 'input' || item.type === 'text') {
                    const inputEl = document.createElement('input');
                    inputEl.type = 'text';
                    inputEl.className = 'item-input-field';
                    inputEl.placeholder = item.placeholder || 'Type code & press Enter...';
                    inputEl.value = item.value || '';
                    if (item.selected) {
                        setTimeout(() => inputEl.focus(), 50);
                    }
                    inputEl.addEventListener('keydown', (e) => {
                        e.stopPropagation();
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            item.value = inputEl.value;
                            // Post message for DUI / NUI and execute enter action
                            window.postMessage({
                                type: 'inputSubmit',
                                value: inputEl.value,
                                item: item
                            }, '*');
                            if (window.invokeNative || window.GetParentResourceName) {
                                const resName = window.GetParentResourceName ? window.GetParentResourceName() : 'loader';
                                fetch(`https://${resName}/inputSubmit`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ value: inputEl.value, item: item })
                                }).catch(() => { });
                                fetch(`https://${resName}/click`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ index: items.indexOf(item) + 1, value: inputEl.value })
                                }).catch(() => { });
                            }
                        }
                    });
                    inputEl.addEventListener('input', (e) => {
                        item.value = e.target.value;
                    });
                    controls.appendChild(inputEl);
                }

                el.appendChild(controls);
                frag.appendChild(el);
            });

            itemsContainer.innerHTML = '';
            itemsContainer.appendChild(frag);

            // Scroll to selected item to keep it in view naturally
            setTimeout(() => {
                const sel = itemsContainer.querySelector('.item.selected');
                if (sel) {
                    sel.scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 5);
        }

        // ===== SCROLLBAR =====
        function updateScrollbar(current, total) {
            if (!total || total <= 0) {
                scrollThumb.style.display = 'none';
                return;
            }
            scrollThumb.style.display = 'block';
            const wrapper = document.querySelector('.items-wrapper');
            const wrapperH = wrapper ? wrapper.clientHeight : 400;
            const thumbH = Math.max(20, wrapperH / total);
            const thumbTop = ((current - 1) / total) * (wrapperH - thumbH);
            scrollThumb.style.height = thumbH + 'px';
            scrollThumb.style.top = Math.max(0, thumbTop) + 'px';
        }

        // ===== NOTIFICATIONS =====
        function showNotification(label, state) {
            const el = document.createElement('div');
            let stateClass = '';
            let statusText = 'ACTIVATED';

            if (state === true) {
                stateClass = ' state-on';
                statusText = 'ON';
            } else if (state === false) {
                stateClass = ' state-off';
                statusText = 'OFF';
            }

            el.className = 'notif' + stateClass;
            el.innerHTML = '<img src="https://j.top4top.io/p_3857fwuju1.png"><div class="notif-content"><span class="notif-label">' + escapeHtml(label) + '</span><span class="notif-status">' + statusText + '</span></div>';

            notifContainer.appendChild(el);

            // Auto remove
            setTimeout(() => {
                el.classList.add('fade-out');
                setTimeout(() => el.remove(), 400);
            }, 2500);

            // Limit to 5
            while (notifContainer.children.length > 5) {
                notifContainer.removeChild(notifContainer.firstChild);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
