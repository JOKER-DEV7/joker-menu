<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Joker Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgba(0, 0, 0, 0);
            font-family: 'Inter', 'Cairo', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ===== MAIN WRAPPER ===== */
        #menu {
            position: absolute;
            top: 15%;
            left: 50px;
            /* Shifted right slightly to make room for scrollbar */
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Gap between separate blocks */
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #menu.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Shared block styles */
        .block {
            background: rgba(12, 4, 4, 0.98);
            border-radius: 6px;
            border: 1px solid rgba(255, 20, 20, 0.3);
            box-shadow: 0 0 15px rgba(100, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
        }

        /* ===== TOP BLOCK (Header + Tabs) ===== */
        .menu-top {
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            height: 110px;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #8b0000;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(200, 0, 0, 0.1), rgba(0, 0, 0, 0.8));
            pointer-events: none;
        }

        .header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Make it fill like a banner */
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        /* Tabs inside Top Block */
        .tabs {
            display: flex;
            width: 100%;
            background: rgba(15, 2, 2, 0.95);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 1 0 auto;
            text-align: center;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            cursor: default;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #fff;
            background: linear-gradient(to top, rgba(255, 20, 20, 0.2), transparent);
            border-bottom: 3px solid #ff3333;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        /* ===== BODY BLOCK (Items) ===== */
        .menu-body {
            height: 480px;
            position: relative;
        }

        .items-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 5px 0;
        }

        .items-container::-webkit-scrollbar {
            display: none;
        }

        /* External Scrollbar */
        .scroll-indicator {
            position: absolute;
            top: 0;
            left: -15px;
            /* Detached to the left */
            width: 6px;
            height: 100%;
            background: rgba(10, 2, 2, 0.8);
            border-radius: 3px;
            border: 1px solid rgba(255, 20, 20, 0.2);
            overflow: hidden;
        }

        .scroll-thumb {
            width: 100%;
            background: #ff3333;
            border-radius: 3px;
            position: absolute;
            top: 0;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
            transition: top 0.1s ease, height 0.1s ease;
        }

        /* ===== FOOTER BLOCK ===== */
        .menu-footer {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .footer-counter {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== ITEM STYLES ===== */
        .item {
            width: 100%;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border-left: 3px solid transparent;
            transition: all 0.1s ease;
        }

        .item.selected {
            background: linear-gradient(90deg, rgba(220, 20, 20, 0.35) 0%, rgba(40, 5, 5, 0.15) 100%);
            border: 1px solid rgba(255, 50, 50, 0.6);
            border-left: 4px solid #ff3333;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(255, 30, 30, 0.25);
            transform: translateX(4px);
        }

        .item-label {
            font-size: 14px;
            font-weight: 500;
            color: #dcdcdc;
            transition: color 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .item.selected .item-label {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.4);
        }

        /* Submenu arrow */
        .item-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
        }

        .item.selected .item-arrow {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.6);
        }

        /* Controls */
        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .slider-track {
            width: 90px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: visible;
        }

        .slider-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s ease;
        }

        .slider-knob {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.1s ease;
        }

        .item.selected .slider-fill {
            background: #ff3333;
        }

        .item.selected .slider-knob {
            background: #ff3333;
            box-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        /* Toggle */
        .toggle {
            width: 28px;
            height: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.2s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #aaa;
            transition: all 0.2s;
        }

        .toggle.on {
            background: rgba(255, 50, 50, 0.3);
            border: 1px solid #ff3333;
        }

        .toggle.on::after {
            left: 14px;
            background: #ff3333;
            box-shadow: 0 0 5px #ff3333;
        }

        .item-value {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            min-width: 35px;
            text-align: right;
        }

        .item.selected .item-value {
            color: #ffcccc;
        }

        /* ===== STARTUP NOTIFICATION ===== */
        #startup-notification {
            position: absolute;
            top: 30px;
            right: -400px;
            width: 320px;
            background: rgba(12, 4, 4, 0.98);
            /* Solid color matching menu */
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            /* Centered layout */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.3);
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
            opacity: 0;
            z-index: 1000;
        }

        #startup-notification.show {
            right: 30px;
            opacity: 1;
        }

        #startup-notification img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
            margin-bottom: 10px;
            transform: scale(2.0);
            /* Drastically increase visual size */
        }

        .startup-content {
            text-align: center;
        }

        .startup-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.8);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .startup-message {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }

        /* ===== SIDE NOTIFICATIONS ===== */
        .notif-container {
            position: absolute;
            bottom: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 999;
        }

        .notif {
            background: rgba(12, 4, 4, 0.98);
            /* Solid matching color */
            border: 1px solid rgba(255, 20, 20, 0.3);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            width: 280px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            /* Center horizontally */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            color: #fff;
            font-family: 'Inter', 'Cairo', sans-serif;
        }

        .notif img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.5));
            transform: scale(2.5);
            /* Make logo appear MUCH larger inside the box */
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .notif-label {
            font-size: 13px;
            font-weight: 600;
            color: #eee;
        }

        .notif-status {
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
        }

        .notif.state-on .notif-status {
            color: #4CAF50;
        }

        .notif.state-off .notif-status {
            color: #F44336;
        }

        .notif.fade-out {
            animation: slideOut 0.4s ease forwards;
        }

        /* ===== LANGUAGE SELECTOR ===== */
        #lang-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 320px;
            background: rgba(12, 4, 4, 0.98);
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-top: 4px solid #ff3333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        #lang-selector.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .lang-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        .lang-option {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            transition: all 0.2s ease;
        }

        .lang-option.selected {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.4);
        }

        .lang-hint {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }

        /* ===== JK ARMORY PANEL (RIGHT SIDE) ===== */
        #jk-armory {
            position: absolute;
            top: 0; right: 0;
            width: 480px;
            height: 100vh;
            background: linear-gradient(180deg, rgba(8,8,12,0.98) 0%, rgba(14,10,18,0.98) 100%);
            border-left: 1px solid rgba(255,40,40,0.15);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(40px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
        }
        #jk-armory.visible {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .armory-header {
            padding: 18px 22px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .armory-logo {
            display: flex; align-items: center; gap: 10px;
        }
        .armory-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #ff2222 0%, #cc0000 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 14px; color: #fff;
            box-shadow: 0 0 20px rgba(255,30,30,0.3);
        }
        .armory-logo-text {
            font-size: 16px; font-weight: 700; color: #fff;
            letter-spacing: 2px;
        }
        .armory-logo-text span { color: #ff3333; }
        .armory-badge {
            background: rgba(255,50,50,0.12);
            border: 1px solid rgba(255,50,50,0.25);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 10px;
            color: #ff5555;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .armory-search {
            padding: 12px 22px;
            flex-shrink: 0;
        }
        .armory-search-box {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px 10px 36px;
            color: #ccc;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .armory-search-box::placeholder { color: #555; }
        .armory-search-box:focus { border-color: rgba(255,50,50,0.4); }
        .armory-search-wrap {
            position: relative;
        }
        .armory-search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 0.5;
        }

        .armory-cats {
            display: flex;
            gap: 6px;
            padding: 0 22px 12px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .armory-cats::-webkit-scrollbar { display: none; }
        .armory-cat {
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #888;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .armory-cat.active {
            background: rgba(255,40,40,0.15);
            border-color: rgba(255,40,40,0.4);
            color: #ff4444;
            box-shadow: 0 0 12px rgba(255,30,30,0.15);
        }

        .armory-count-bar {
            padding: 4px 22px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .armory-count {
            font-size: 11px; color: #555; font-weight: 500;
        }
        .armory-count b { color: #ff4444; font-weight: 700; }
        .armory-keys {
            display: flex; gap: 8px;
        }
        .armory-key {
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 9px;
            color: #666;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .armory-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 22px 16px;
        }
        .armory-list::-webkit-scrollbar { width: 3px; }
        .armory-list::-webkit-scrollbar-track { background: transparent; }
        .armory-list::-webkit-scrollbar-thumb { background: rgba(255,50,50,0.3); border-radius: 3px; }

        .armory-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .armory-item.selected {
            background: rgba(255,40,40,0.08);
            border-color: rgba(255,40,40,0.35);
            box-shadow: 0 0 15px rgba(255,30,30,0.1);
        }
        .armory-item-img {
            width: 50px; height: 50px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            flex-shrink: 0;
        }
        .armory-item-info {
            flex: 1;
            min-width: 0;
        }
        .armory-item-name {
            font-size: 13px;
            font-weight: 700;
            color: #e0e0e0;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .armory-item.selected .armory-item-name { color: #fff; }
        .armory-item-hash {
            font-size: 10px;
            color: #555;
            font-family: 'Courier New', monospace;
        }
        .armory-item-cat {
            font-size: 9px;
            color: #ff5555;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .armory-item-arrow {
            color: #ff3333;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .armory-item.selected .armory-item-arrow { opacity: 1; }

        .armory-footer {
            padding: 12px 22px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .armory-footer-brand {
            font-size: 10px; color: #333;
            font-weight: 600; letter-spacing: 2px;
        }
        .armory-footer-hint {
            font-size: 10px; color: #555;
        }
        .armory-footer-hint kbd {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 9px;
            color: #888;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }
    </style>
</head>

<body>
    <!-- STARTUP NOTIFICATION -->
    <div id="startup-notification">
        <img src="https://j.top4top.io/p_3857fwuju1.png" alt="JK">
        <div class="startup-content">
            <div class="startup-title">JK MENU</div>
            <div class="startup-message">مرحباً بك في المنيو</div>
        </div>
    </div>

    <!-- MAIN MENU WRAPPER -->
    <div id="menu">

        <!-- TOP BLOCK: Header + Tabs -->
        <div class="block menu-top">
            <div class="header">
                <!-- Using the header eagle with full width banner style -->
                <img src="https://l.top4top.io/p_38575ot9i1.png" alt="Banner">
            </div>
            <div class="tabs" id="tabsContainer"></div>
        </div>

        <!-- BODY BLOCK: Items -->
        <div class="block menu-body">
            <div class="scroll-indicator">
                <div class="scroll-thumb" id="scrollThumb"></div>
            </div>
            <div class="items-container" id="itemsContainer"></div>
        </div>

        <!-- FOOTER BLOCK: Info -->
        <div class="block menu-footer">
            <span class="footer-text">Joker Menu V2</span>
            <span class="footer-counter" id="footerCounter">(0/0)</span>
        </div>

    </div>

    <div class="notif-container" id="notifContainer"></div>

    <!-- LANGUAGE SELECTOR -->
    <div id="lang-selector">
        <div class="lang-title" id="langTitle">Choose your language<br>اختر لغتك</div>
        <div class="lang-option" id="lang-en">English</div>
        <div class="lang-option" id="lang-ar">العربية</div>
        <div class="lang-hint">Press ENTER to select / اضغط انتر للاختيار</div>
    </div>

    <!-- JK ARMORY PANEL -->
    <div id="jk-armory">
        <div class="armory-header">
            <div class="armory-logo">
                <div class="armory-logo-icon">JK</div>
                <div class="armory-logo-text">JK <span>ARMORY</span></div>
            </div>
            <div class="armory-badge" id="armoryBadge">PREMIUM</div>
        </div>

        <div class="armory-search">
            <div class="armory-search-wrap">
                <input type="text" class="armory-search-box" id="armorySearch" placeholder="ابحث عن سلاح أو ايتم..." readonly>
            </div>
        </div>

        <div class="armory-cats" id="armoryCats"></div>

        <div class="armory-count-bar">
            <div class="armory-count"><b id="armoryItemCount">0</b> ايتم في <b id="armoryCatCount">0</b> قسم</div>
            <div class="armory-keys">
                <span class="armory-key">↑↓ تنقل</span>
                <span class="armory-key">Q/E قسم</span>
                <span class="armory-key">ENTER اختيار</span>
                <span class="armory-key">ESC اغلاق</span>
            </div>
        </div>

        <div class="armory-list" id="armoryList"></div>

        <div class="armory-footer">
            <div class="armory-footer-brand">DISCORD.GG/JKMENU</div>
            <div class="armory-footer-hint"><kbd>ENTER</kbd> لإضافة العنصر</div>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const tabsContainer = document.getElementById('tabsContainer');
        const itemsContainer = document.getElementById('itemsContainer');
        const footerCounter = document.getElementById('footerCounter');
        const scrollThumb = document.getElementById('scrollThumb');
        const notifContainer = document.getElementById('notifContainer');
        const langSelector = document.getElementById('lang-selector');
        const langEn = document.getElementById('lang-en');
        const langAr = document.getElementById('lang-ar');

        let currentData = null;

        // Listen for messages from Lua
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'menuUpdate':
                    handleMenuUpdate(data);
                    langSelector.classList.remove('show');
                    break;
                case 'notification':
                    showNotification(data.label, data.state);
                    break;
                case 'startup':
                    showStartupNotification(data.label);
                    break;
                case 'langSelect':
                    showLangSelect(data.selectedLang);
                    break;
                case 'spawnMenuUpdate':
                    handleSpawnMenuUpdate(data);
                    break;
            }
        });

        // ===== JK ARMORY (SPAWN MENU RIGHT PANEL) =====
        const jkArmory = document.getElementById('jk-armory');
        const armorySearch = document.getElementById('armorySearch');
        const armoryCats = document.getElementById('armoryCats');
        const armoryItemCount = document.getElementById('armoryItemCount');
        const armoryCatCount = document.getElementById('armoryCatCount');
        const armoryList = document.getElementById('armoryList');

        function handleSpawnMenuUpdate(data) {
            if (!data.open) {
                if (jkArmory) jkArmory.classList.remove('visible');
                return;
            }
            menu.classList.remove('visible');
            if (jkArmory) jkArmory.classList.add('visible');

            // Update stats
            armoryCatCount.textContent = data.categories ? data.categories.length : 0;
            let totItems = 0;
            if (data.categories) {
                data.categories.forEach(c => totItems += (c.items ? c.items.length : 0));
            }
            armoryItemCount.textContent = totItems;

            if (!data.categories || data.categories.length === 0) return;

            // Render Categories
            let tabsHtml = '';
            data.categories.forEach((cat, index) => {
                const isActive = (index + 1) === data.currentCat ? 'active' : '';
                tabsHtml += `<div class="armory-cat ${isActive}">${cat.label || cat.name}</div>`;
            });
            armoryCats.innerHTML = tabsHtml;

            // Render Item List
            let listHtml = '';
            const currentCategory = data.categories[data.currentCat - 1];
            if (currentCategory && currentCategory.items) {
                currentCategory.items.forEach((item, index) => {
                    const isSelected = (index + 1) === data.currentIndex ? 'selected' : '';
                    const imgUrl = item.img || 'https://j.top4top.io/p_3857fwuju1.png'; // fallback eagle
                    const spawnCode = item.spawn || item.name || '';

                    listHtml += `
                        <div class="armory-item ${isSelected}" id="armory-item-${index + 1}">
                            <img src="${imgUrl}" class="armory-item-img" onerror="this.src='https://j.top4top.io/p_3857fwuju1.png'">
                            <div class="armory-item-info">
                                <div class="armory-item-name">${item.name || item.label}</div>
                                <div class="armory-item-hash">${spawnCode}</div>
                            </div>
                            <div class="armory-item-cat">${currentCategory.label || currentCategory.name}</div>
                            <div class="armory-item-arrow">→</div>
                        </div>
                    `;
                });
            }
            armoryList.innerHTML = listHtml;

            // Scroll selected tab and item into view
            setTimeout(() => {
                const activeCat = armoryCats.querySelector('.armory-cat.active');
                if (activeCat) activeCat.scrollIntoView({ behavior: 'smooth', inline: 'center' });

                const activeItem = armoryList.querySelector('.armory-item.selected');
                if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 30);
        }

        // ===== LANGUAGE SELECTOR =====
        function showLangSelect(selected) {
            langSelector.classList.add('show');
            if (selected === 'en') {
                langEn.classList.add('selected');
                langAr.classList.remove('selected');
            } else {
                langAr.classList.add('selected');
                langEn.classList.remove('selected');
            }
        }

        // ===== STARTUP NOTIFICATION =====
        function showStartupNotification(label) {
            const el = document.getElementById('startup-notification');
            el.classList.add('show');
            setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        // ===== MENU UPDATE =====
        function handleMenuUpdate(data) {
            currentData = data;

            if (!data.open) {
                menu.classList.remove('visible');
                return;
            }

            if (jkArmory) jkArmory.classList.remove('visible');
            menu.classList.add('visible');

            renderTabs(data.tabs);
            renderItems(data.items);
            updateScrollbar(data.currentIndex, data.totalItems);
            footerCounter.textContent = '(' + data.currentIndex + '/' + data.totalItems + ')';
        }

        // ===== RENDER TABS =====
        function renderTabs(tabs) {
            if (!tabs) return;

            const frag = document.createDocumentFragment();
            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.active ? ' active' : '');
                el.textContent = tab.name;
                frag.appendChild(el);
            });

            tabsContainer.innerHTML = '';
            tabsContainer.appendChild(frag);

            // Scroll the active tab into view so hidden tabs on the right are revealed
            setTimeout(() => {
                const activeTab = tabsContainer.querySelector('.tab.active');
                if (activeTab) {
                    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 50);
        }

        // ===== RENDER ITEMS =====
        function renderItems(items) {
            if (!items) return;

            const frag = document.createDocumentFragment();

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.15);font-size:14px;';
                empty.textContent = 'No items available';
                frag.appendChild(empty);
                itemsContainer.innerHTML = '';
                itemsContainer.appendChild(frag);
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                const isSection = item.label && item.label.startsWith('~y~');
                el.className = 'item' + (item.selected ? ' selected' : '') + (isSection ? ' item-section' : '');

                // Label
                const label = document.createElement('span');
                label.className = 'item-label';

                let labelText = (item.label || '').replace(/~[a-zA-Z]~/g, '');

                if (item.type === 'toggle_slider' && item.value !== undefined) {
                    labelText += ': ' + Number(item.value).toFixed(2);
                } else if (item.type === 'key_slider' && item.keyLabel) {
                    labelText += ': [' + item.keyLabel + ']';
                } else if (item.type === 'player_slider' && item.playerInfo) {
                    labelText += ': ' + item.playerInfo;
                } else if (item.type === 'slider' && item.value !== undefined) {
                    if (item.valueDisplay) {
                        labelText += ': [' + item.valueDisplay + ']';
                    } else {
                        labelText += ': ' + Math.floor(item.value);
                    }
                }

                label.textContent = labelText;
                el.appendChild(label);

                // Controls wrapper
                const controls = document.createElement('div');
                controls.className = 'item-controls';

                // Slider
                if (['slider', 'toggle_slider', 'key_slider', 'player_slider'].includes(item.type)) {
                    const range = (item.max || 1) - (item.min || 0);
                    const pct = range > 0 ? (((item.value || 0) - (item.min || 0)) / range) * 100 : 0;

                    const track = document.createElement('div');
                    track.className = 'slider-track';

                    const fill = document.createElement('div');
                    fill.className = 'slider-fill';
                    fill.style.width = Math.min(100, Math.max(0, pct)) + '%';

                    const knob = document.createElement('div');
                    knob.className = 'slider-knob';
                    knob.style.left = Math.min(100, Math.max(0, pct)) + '%';

                    track.appendChild(fill);
                    track.appendChild(knob);
                    controls.appendChild(track);
                }

                // Toggle
                if (item.type === 'toggle' || item.type === 'checkbox' || item.type === 'toggle_slider') {
                    const toggle = document.createElement('div');
                    toggle.className = 'toggle ' + (item.state ? 'on' : 'off');
                    controls.appendChild(toggle);
                }

                el.appendChild(controls);
                frag.appendChild(el);
            });

            itemsContainer.innerHTML = '';
            itemsContainer.appendChild(frag);

            // Scroll to selected item to keep it in view naturally
            setTimeout(() => {
                const sel = itemsContainer.querySelector('.item.selected');
                if (sel) {
                    sel.scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 5);
        }

        // ===== SCROLLBAR =====
        function updateScrollbar(current, total) {
            if (!total || total <= 0) {
                scrollThumb.style.display = 'none';
                return;
            }
            scrollThumb.style.display = 'block';
            const wrapper = document.querySelector('.items-wrapper');
            const wrapperH = wrapper ? wrapper.clientHeight : 400;
            const thumbH = Math.max(20, wrapperH / total);
            const thumbTop = ((current - 1) / total) * (wrapperH - thumbH);
            scrollThumb.style.height = thumbH + 'px';
            scrollThumb.style.top = Math.max(0, thumbTop) + 'px';
        }

        // ===== NOTIFICATIONS =====
        function showNotification(label, state) {
            const el = document.createElement('div');
            let stateClass = '';
            let statusText = 'ACTIVATED';

            if (state === true) {
                stateClass = ' state-on';
                statusText = 'ON';
            } else if (state === false) {
                stateClass = ' state-off';
                statusText = 'OFF';
            }

            el.className = 'notif' + stateClass;
            el.innerHTML = '<img src="https://j.top4top.io/p_3857fwuju1.png"><div class="notif-content"><span class="notif-label">' + escapeHtml(label) + '</span><span class="notif-status">' + statusText + '</span></div>';

            notifContainer.appendChild(el);

            // Auto remove
            setTimeout(() => {
                el.classList.add('fade-out');
                setTimeout(() => el.remove(), 400);
            }, 2500);

            // Limit to 5
            while (notifContainer.children.length > 5) {
                notifContainer.removeChild(notifContainer.firstChild);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
