<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Joker Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: rgba(0, 0, 0, 0);
            font-family: 'Inter', 'Cairo', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ===== MAIN WRAPPER ===== */
        #menu {
            position: absolute;
            top: 15%;
            left: 50px; /* Shifted right slightly to make room for scrollbar */
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Gap between separate blocks */
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #menu.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Shared block styles */
        .block {
            background: rgba(12, 4, 4, 0.98);
            border-radius: 6px;
            border: 1px solid rgba(255, 20, 20, 0.3);
            box-shadow: 0 0 15px rgba(100, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
        }

        /* ===== TOP BLOCK (Header + Tabs) ===== */
        .menu-top {
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            height: 110px;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #8b0000;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(200,0,0,0.1), rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .header img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Make it fill like a banner */
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        /* Tabs inside Top Block */
        .tabs {
            display: flex;
            width: 100%;
            background: rgba(15, 2, 2, 0.95);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            flex: 1 0 auto;
            text-align: center;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            cursor: default;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: #fff;
            background: linear-gradient(to top, rgba(255, 20, 20, 0.2), transparent);
            border-bottom: 3px solid #ff3333;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        /* ===== BODY BLOCK (Items) ===== */
        .menu-body {
            height: 480px;
            position: relative;
        }

        .items-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 5px 0;
        }
        .items-container::-webkit-scrollbar { display: none; }

        /* External Scrollbar */
        .scroll-indicator {
            position: absolute;
            top: 0;
            left: -15px; /* Detached to the left */
            width: 6px;
            height: 100%;
            background: rgba(10, 2, 2, 0.8);
            border-radius: 3px;
            border: 1px solid rgba(255, 20, 20, 0.2);
            overflow: hidden;
        }

        .scroll-thumb {
            width: 100%;
            background: #ff3333;
            border-radius: 3px;
            position: absolute;
            top: 0;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
            transition: top 0.1s ease, height 0.1s ease;
        }

        /* ===== FOOTER BLOCK ===== */
        .menu-footer {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }
        .footer-counter {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== ITEM STYLES ===== */
        .item {
            width: 100%;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border-left: 3px solid transparent;
            transition: all 0.1s ease;
        }

        .item.selected {
            background: linear-gradient(90deg, rgba(200, 20, 20, 0.25) 0%, rgba(30, 5, 5, 0.1) 100%);
            border-left: 3px solid #ff3333;
        }

        .item-label {
            font-size: 14px;
            font-weight: 500;
            color: #dcdcdc;
            transition: color 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .item.selected .item-label {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.4);
        }

        /* Submenu arrow */
        .item-arrow {
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
        }
        .item.selected .item-arrow {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 50, 50, 0.6);
        }

        /* Controls */
        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .slider-track {
            width: 90px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: visible;
        }
        .slider-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s ease;
        }
        .slider-knob {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.1s ease;
        }
        .item.selected .slider-fill { background: #ff3333; }
        .item.selected .slider-knob { background: #ff3333; box-shadow: 0 0 8px rgba(255,50,50,0.6); }

        /* Toggle */
        .toggle {
            width: 28px;
            height: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.2s;
        }
        .toggle::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #aaa;
            transition: all 0.2s;
        }
        .toggle.on { background: rgba(255, 50, 50, 0.3); border: 1px solid #ff3333; }
        .toggle.on::after {
            left: 14px;
            background: #ff3333;
            box-shadow: 0 0 5px #ff3333;
        }

        .item-value {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            min-width: 35px;
            text-align: right;
        }
        .item.selected .item-value { color: #ffcccc; }

        /* ===== STARTUP NOTIFICATION ===== */
        #startup-notification {
            position: absolute;
            top: 30px;
            right: -400px;
            width: 320px;
            background: rgba(12, 4, 4, 0.98); /* Solid color matching menu */
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            display: flex;
            flex-direction: column; /* Centered layout */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.3);
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
            opacity: 0;
            z-index: 1000;
        }

        #startup-notification.show {
            right: 30px;
            opacity: 1;
        }

        #startup-notification img {
            width: 80px; 
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
            margin-bottom: 10px;
            transform: scale(2.0); /* Drastically increase visual size */
        }

        .startup-content {
            text-align: center;
        }

        .startup-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.8);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .startup-message {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }

        /* ===== SIDE NOTIFICATIONS ===== */
        .notif-container {
            position: absolute;
            bottom: 40px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 999;
        }

        .notif {
            background: rgba(12, 4, 4, 0.98); /* Solid matching color */
            border: 1px solid rgba(255, 20, 20, 0.3);
            border-left: 4px solid #ff3333;
            border-radius: 6px;
            width: 280px;
            padding: 12px 15px;
            display: flex;
            align-items: center; /* Center horizontally */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            color: #fff;
            font-family: 'Inter', 'Cairo', sans-serif;
        }

        .notif img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.5));
            transform: scale(2.5); /* Make logo appear MUCH larger inside the box */
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .notif-label {
            font-size: 13px;
            font-weight: 600;
            color: #eee;
        }

        .notif-status {
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
        }

        .notif.state-on .notif-status { color: #4CAF50; }
        .notif.state-off .notif-status { color: #F44336; }

        .notif.fade-out {
            animation: slideOut 0.4s ease forwards;
        }

        /* ===== LANGUAGE SELECTOR ===== */
        #lang-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 320px;
            background: rgba(12, 4, 4, 0.98);
            border: 1px solid rgba(255, 20, 20, 0.4);
            border-top: 4px solid #ff3333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        #lang-selector.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .lang-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.6);
        }

        .lang-option {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            transition: all 0.2s ease;
        }

        .lang-option.selected {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.4);
        }

        .lang-hint {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }
    </style>
</head>
<body>
    <!-- STARTUP NOTIFICATION -->
    <div id="startup-notification">
        <img src="https://j.top4top.io/p_3857fwuju1.png" alt="JK">
        <div class="startup-content">
            <div class="startup-title">JK MENU</div>
            <div class="startup-message">مرحباً بك في المنيو</div>
        </div>
    </div>

    <!-- MAIN MENU WRAPPER -->
    <div id="menu">
        
        <!-- TOP BLOCK: Header + Tabs -->
        <div class="block menu-top">
            <div class="header">
                <!-- Using the header eagle with full width banner style -->
                <img src="https://l.top4top.io/p_38575ot9i1.png" alt="Banner">
            </div>
            <div class="tabs" id="tabsContainer"></div>
        </div>

        <!-- BODY BLOCK: Items -->
        <div class="block menu-body">
            <div class="scroll-indicator">
                <div class="scroll-thumb" id="scrollThumb"></div>
            </div>
            <div class="items-container" id="itemsContainer"></div>
        </div>

        <!-- FOOTER BLOCK: Info -->
        <div class="block menu-footer">
            <span class="footer-text">Joker Menu V2</span>
            <span class="footer-counter" id="footerCounter">(0/0)</span>
        </div>

    </div>

    <div class="notif-container" id="notifContainer"></div>

    <!-- LANGUAGE SELECTOR -->
    <div id="lang-selector">
        <div class="lang-title" id="langTitle">Choose your language<br>اختر لغتك</div>
        <div class="lang-option" id="lang-en">English</div>
        <div class="lang-option" id="lang-ar">العربية</div>
        <div class="lang-hint">Press ENTER to select / اضغط انتر للاختيار</div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const tabsContainer = document.getElementById('tabsContainer');
        const itemsContainer = document.getElementById('itemsContainer');
        const footerCounter = document.getElementById('footerCounter');
        const scrollThumb = document.getElementById('scrollThumb');
        const notifContainer = document.getElementById('notifContainer');
        const langSelector = document.getElementById('lang-selector');
        const langEn = document.getElementById('lang-en');
        const langAr = document.getElementById('lang-ar');

        let currentData = null;

        // Listen for messages from Lua
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'menuUpdate':
                    handleMenuUpdate(data);
                    langSelector.classList.remove('show');
                    break;
                case 'notification':
                    showNotification(data.label, data.state);
                    break;
                case 'startup':
                    showStartupNotification(data.label);
                    break;
                case 'langSelect':
                    showLangSelect(data.selectedLang);
                    break;
            }
        });

        // ===== LANGUAGE SELECTOR =====
        function showLangSelect(selected) {
            langSelector.classList.add('show');
            if (selected === 'en') {
                langEn.classList.add('selected');
                langAr.classList.remove('selected');
            } else {
                langAr.classList.add('selected');
                langEn.classList.remove('selected');
            }
        }

        // ===== STARTUP NOTIFICATION =====
        function showStartupNotification(label) {
            const el = document.getElementById('startup-notification');
            el.classList.add('show');
            setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        // ===== MENU UPDATE =====
        function handleMenuUpdate(data) {
            currentData = data;

            if (!data.open) {
                menu.classList.remove('visible');
                return;
            }

            menu.classList.add('visible');

            renderTabs(data.tabs);
            renderItems(data.items);
            updateScrollbar(data.currentIndex, data.totalItems);
            footerCounter.textContent = '(' + data.currentIndex + '/' + data.totalItems + ')';
        }

        // ===== RENDER TABS =====
        function renderTabs(tabs) {
            if (!tabs) return;

            const frag = document.createDocumentFragment();
            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.active ? ' active' : '');
                el.textContent = tab.name;
                frag.appendChild(el);
            });

            tabsContainer.innerHTML = '';
            tabsContainer.appendChild(frag);

            // Scroll the active tab into view so hidden tabs on the right are revealed
            setTimeout(() => {
                const activeTab = tabsContainer.querySelector('.tab.active');
                if (activeTab) {
                    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 50);
        }

        // ===== RENDER ITEMS =====
        function renderItems(items) {
            if (!items) return;

            const frag = document.createDocumentFragment();

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.15);font-size:14px;';
                empty.textContent = 'No items available';
                frag.appendChild(empty);
                itemsContainer.innerHTML = '';
                itemsContainer.appendChild(frag);
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                const isSection = item.label && item.label.startsWith('~y~');
                el.className = 'item' + (item.selected ? ' selected' : '') + (isSection ? ' item-section' : '');

                // Label
                const label = document.createElement('span');
                label.className = 'item-label';

                let labelText = (item.label || '').replace(/~[a-zA-Z]~/g, '');

                if (item.type === 'toggle_slider' && item.value !== undefined) {
                    labelText += ': ' + Number(item.value).toFixed(2);
                } else if (item.type === 'key_slider' && item.keyLabel) {
                    labelText += ': [' + item.keyLabel + ']';
                } else if (item.type === 'player_slider' && item.playerInfo) {
                    labelText += ': ' + item.playerInfo;
                } else if (item.type === 'slider' && item.value !== undefined) {
                    if (item.valueDisplay) {
                        labelText += ': [' + item.valueDisplay + ']';
                    } else {
                        labelText += ': ' + Math.floor(item.value);
                    }
                }

                label.textContent = labelText;
                el.appendChild(label);

                // Controls wrapper
                const controls = document.createElement('div');
                controls.className = 'item-controls';

                // Slider
                if (['slider', 'toggle_slider', 'key_slider', 'player_slider'].includes(item.type)) {
                    const range = (item.max || 1) - (item.min || 0);
                    const pct = range > 0 ? (((item.value || 0) - (item.min || 0)) / range) * 100 : 0;

                    const track = document.createElement('div');
                    track.className = 'slider-track';

                    const fill = document.createElement('div');
                    fill.className = 'slider-fill';
                    fill.style.width = Math.min(100, Math.max(0, pct)) + '%';

                    const knob = document.createElement('div');
                    knob.className = 'slider-knob';
                    knob.style.left = Math.min(100, Math.max(0, pct)) + '%';

                    track.appendChild(fill);
                    track.appendChild(knob);
                    controls.appendChild(track);
                }

                // Toggle
                if (item.type === 'toggle' || item.type === 'toggle_slider') {
                    const toggle = document.createElement('div');
                    toggle.className = 'toggle ' + (item.state ? 'on' : 'off');
                    controls.appendChild(toggle);
                }

                el.appendChild(controls);
                frag.appendChild(el);
            });

            itemsContainer.innerHTML = '';
            itemsContainer.appendChild(frag);

            // Scroll to selected
            requestAnimationFrame(() => {
                const sel = itemsContainer.querySelector('.item.selected');
                if (sel) {
                    sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            });
        }

        // ===== SCROLLBAR =====
        function updateScrollbar(current, total) {
            if (!total || total <= 0) {
                scrollThumb.style.display = 'none';
                return;
            }
            scrollThumb.style.display = 'block';
            const wrapper = document.querySelector('.items-wrapper');
            const wrapperH = wrapper ? wrapper.clientHeight : 400;
            const thumbH = Math.max(20, wrapperH / total);
            const thumbTop = ((current - 1) / total) * (wrapperH - thumbH);
            scrollThumb.style.height = thumbH + 'px';
            scrollThumb.style.top = Math.max(0, thumbTop) + 'px';
        }

        // ===== NOTIFICATIONS =====
        function showNotification(label, state) {
            const el = document.createElement('div');
            let stateClass = '';
            let statusText = 'ACTIVATED';

            if (state === true) {
                stateClass = ' state-on';
                statusText = 'ON';
            } else if (state === false) {
                stateClass = ' state-off';
                statusText = 'OFF';
            }

            el.className = 'notif' + stateClass;
            el.innerHTML = '<img src="https://j.top4top.io/p_3857fwuju1.png"><div class="notif-content"><span class="notif-label">' + escapeHtml(label) + '</span><span class="notif-status">' + statusText + '</span></div>';

            notifContainer.appendChild(el);

            // Auto remove
            setTimeout(() => {
                el.classList.add('fade-out');
                setTimeout(() => el.remove(), 400);
            }, 2500);

            // Limit to 5
            while (notifContainer.children.length > 5) {
                notifContainer.removeChild(notifContainer.firstChild);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
